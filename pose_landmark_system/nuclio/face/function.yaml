type=\"element node\" data-element-id=\"4\" data-node-id=\"4\" data-label-name=\"left_eye_lower\"></circle>\n<circle r=\"1\" cx=\"15\" cy=\"26\" data-type=\"element node\" data-element-id=\"5\" data-node-id=\"5\" data-label-name=\"right_eye_outer\"></circle>\n<circle r=\"1\" cx=\"37\" cy=\"26\" data-type=\"element node\" data-element-id=\"6\" data-node-id=\"6\" data-label-name=\"right_eye_inner\"></circle>\n<circle r=\"1\" cx=\"26\" cy=\"21\" data-type=\"element node\" data-element-id=\"7\" data-node-id=\"7\" data-label-name=\"right_eye_upper\"></circle>\n<circle r=\"1\" cx=\"26\" cy=\"31\" data-type=\"element node\" data-element-id=\"8\" data-node-id=\"8\" data-label-name=\"right_eye_lower\"></circle>\n<circle r=\"1\" cx=\"48\" cy=\"59\" data-type=\"element node\" data-element-id=\"9\" data-node-id=\"9\" data-label-name=\"nose_tip\"></circle>\n<circle r=\"1\" cx=\"64\" cy=\"82\" data-type=\"element node\" data-element-id=\"10\" data-node-id=\"10\" data-label-name=\"mouth_left\"></circle>\n<circle r=\"1\" cx=\"31\" cy=\"82\" data-type=\"element node\" data-element-id=\"11\" data-node-id=\"11\" data-label-name=\"mouth_right\"></circle>\n<circle r=\"1\" cx=\"48\" cy=\"79\" data-type=\"element node\" data-element-id=\"12\" data-node-id=\"12\" data-label-name=\"lip_upper\"></circle>\n<circle r=\"1\" cx=\"48\" cy=\"88\" data-type=\"element node\" data-element-id=\"13\" data-node-id=\"13\" data-label-name=\"lip_lower\"></circle>",
          "sublabels": [
            {
              "id": 0,
              "name": "left_eye_outer",
              "type": "points"
            },
            {
              "id": 1,
              "name": "left_eye_inner",
              "type": "points"
            },
            {
              "id": 2,
              "name": "left_eye_upper",
              "type": "points"
            },
            {
              "id": 3,
              "name": "left_eye_lower",
              "type": "points"
            },
            {
              "id": 4,
