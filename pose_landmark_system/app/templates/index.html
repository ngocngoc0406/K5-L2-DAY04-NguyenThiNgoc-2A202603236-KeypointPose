<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Landmarks + Person Pose</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f3f6fb; color: #172033; }
    main { max-width: 1080px; margin: 32px auto; padding: 0 18px; }
    h1 { margin-bottom: 6px; }
    .note { color: #4a5870; }
    form, .panel { background: white; border: 1px solid #dce3ed; border-radius: 12px; padding: 18px; }
    form { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; background: #185abd; color: white; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 18px; }
    .panel h2 { margin-top: 0; font-size: 1.1rem; }
    img { display: block; max-width: 100%; max-height: 70vh; margin: auto; }
    .result-card { min-width: 0; overflow-wrap: anywhere; }
    .result-card img { max-height: 45vh; }
    #message { min-height: 1.5em; color: #9c2c22; }
    #results { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px ui-monospace, monospace; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Face Landmarks + Person Pose</h1>
  <p class="note">Demo riêng, không dùng kết quả dự đoán làm nhãn nộp bài lab.</p>
  <form id="form">
    <label>Ảnh hoặc thư mục <input id="images" type="file" accept="image/*" multiple webkitdirectory required></label>
    <label>Model
      <select id="mode">
        <option value="face">Face Detection + 13 landmarks</option>
        <option value="person">Person Pose — COCO 17</option>
        <option value="both" selected>Both</option>
      </select>
    </label>
    <label><input id="save" type="checkbox"> Lưu ảnh và JSON kết quả</label>
    <button id="submit" type="submit">Chạy inference</button>
  </form>
  <p id="message" role="status"></p>
  <div>
    <button id="export-face" hidden>Export Face COCO</button>
    <button id="export-person" hidden>Export Person COCO</button>
  </div>
  <div id="gallery" class="grid"></div>
</main>
<script>
  const form = document.getElementById("form");
  const message = document.getElementById("message");
  const submit = document.getElementById("submit");
  const gallery = document.getElementById("gallery");
  const exportButtons = ["face", "person"].map((kind) => {
    const button = document.getElementById(`export-${kind}`);
    button.addEventListener("click", () => {
      button.disabled = true;
      window.location.href = `/api/batch/${button.dataset.batchId}/export/${kind}`;
      setTimeout(() => { button.disabled = false; }, 1500);
    });
    return button;
  });
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const files = [...document.getElementById("images").files]
      .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));
    if (!files.length) return;
    const body = new FormData();
    files.forEach((file) => body.append("images", file));
    body.append("mode", document.getElementById("mode").value);
    body.append("save_result", document.getElementById("save").checked);
    submit.disabled = true;
    message.textContent = "";
    gallery.replaceChildren();
    exportButtons.forEach((button) => { button.hidden = true; });
    message.textContent = `Đang xử lý ${files.length} ảnh...`;
    try {
      const response = await fetch("/api/batch", { method: "POST", body });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Inference thất bại.");
      data.results.forEach((item) => {
        const card = document.createElement("section");
        card.className = "panel result-card";
        const title = document.createElement("h2");
        title.textContent = `${item.filename} — Face ${item.counts.face}, Person ${item.counts.person}`;
        const image = document.createElement("img");
        image.alt = `Kết quả ${item.filename}`;
        image.src = `data:image/jpeg;base64,${item.image_jpeg_base64}`;
        const details = document.createElement("pre");
        details.textContent = item.predictions.map((prediction, index) =>
          `${index + 1}. ${prediction.kind} confidence=${prediction.confidence.toFixed(3)}\n` +
          prediction.keypoints.map(point =>
            `   ${point.name}: (${point.x.toFixed(1)}, ${point.y.toFixed(1)}) conf=${point.confidence.toFixed(3)}`
          ).join("\n")
        ).join("\n\n") || "Không phát hiện đối tượng.";
        card.append(title, image, details);
        gallery.append(card);
      });
      message.textContent = data.batch_id
        ? `Đã xử lý ${data.image_count} ảnh. Batch ${data.batch_id} đã lưu; chọn export để tải COCO.`
        : `Đã xử lý ${data.image_count} ảnh. Bật lưu kết quả để export COCO.`;
      if (data.batch_id) {
        exportButtons.forEach((button) => {
          button.dataset.batchId = data.batch_id;
          button.hidden = false;
        });
      }
    } catch (error) {
      message.textContent = error.message;
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
